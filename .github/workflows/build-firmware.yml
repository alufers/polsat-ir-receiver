name: Build Firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Install Pico SDK
        run: |
          if [ ! -d /usr/share/pico-sdk ]; then
            sudo git clone --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git /usr/share/pico-sdk
          fi

      - name: Configure
        run: cmake -S . -B build -DPOLSAT_ENABLE_SERIAL=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: polsat-ir-receiver-uf2
          path: build/*.uf2
          if-no-files-found: error
